services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-api
      - hello-world
      - hello-world-restricted
      - jaeger
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - AUTH_API_UPSTREAM=http://auth-api:8000
      - HELLO_API_UPSTREAM=http://hello-world:5000
      - HELLO_RESTRICTED_API_UPSTREAM=http://hello-world-restricted:5001
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: auth-api/Dockerfile
    expose:
      - "8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FRONTEND_URL=${FRONTEND_URL}
      - FOUNDRY_PROJECT_ENDPOINT=${FOUNDRY_PROJECT_ENDPOINT}
      - FOUNDRY_AGENT_NAME=${FOUNDRY_AGENT_NAME:-sunnieai}
      - FOUNDRY_AGENT_ID=${FOUNDRY_AGENT_ID}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=auth-api
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  hello-world:
    build:
      context: .
      dockerfile: hello-world/Dockerfile
    expose:
      - "5000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=hello-world
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  hello-world-restricted:
    build:
      context: .
      dockerfile: hello-world-restricted/Dockerfile
    expose:
      - "5001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=hello-world-restricted
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: actual-server-setup/mcp-server/Dockerfile
    expose:
      - "8090"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FINANCE_API_URL=${FINANCE_API_URL}
      - FINANCE_API_KEY=${FINANCE_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=mcp-server
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
