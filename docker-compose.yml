services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    environment:
      - AUTH_API_UPSTREAM=http://auth-api:8000
      - HELLO_API_UPSTREAM=http://hello-world:5000
      - HELLO_RESTRICTED_API_UPSTREAM=http://hello-world-restricted:5001
    depends_on:
      - auth-api
      - hello-world
      - hello-world-restricted
    restart: unless-stopped

  auth-api:
    build: ./auth-api
    expose:
      - "8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hello-world:
    build: ./hello-world
    expose:
      - "5000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped

  hello-world-restricted:
    build: ./hello-world-restricted
    expose:
      - "5001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
