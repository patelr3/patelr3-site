events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream auth_api {
        server auth-api:8000;
    }

    upstream hello_world {
        server hello-world:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Auth API (public) ──────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Internal auth verification (used by auth_request) ─
        location = /_auth_verify {
            internal;
            proxy_pass http://auth_api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # ── Protected: Hello-World service ─────────────────────
        location /api/hello/ {
            auth_request /_auth_verify;

            # Forward user info from auth response headers
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Role $auth_role;

            proxy_pass http://hello_world/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Frontend (public) ─────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
