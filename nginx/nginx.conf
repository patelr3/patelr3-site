events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging with request ID ──────────────────────────────
    log_format traced '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'request_id=$request_id';
    access_log /var/log/nginx/access.log traced;

    upstream frontend {
        server frontend:3000;
    }

    upstream auth_api {
        server auth-api:8000;
    }

    upstream hello_world {
        server hello-world:5000;
    }

    upstream hello_world_restricted {
        server hello-world-restricted:5001;
    }

    upstream mcp_server {
        server mcp-server:8090;
    }

    upstream jaeger_otlp {
        server jaeger:4318;
    }

    # Use incoming X-Request-Id if present, otherwise generate one
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    server {
        listen 80;
        server_name localhost;

        # ── OTLP collector proxy (for browser trace export) ───
        location /otlp/ {
            proxy_pass http://jaeger_otlp/;
            proxy_set_header Host $host;
        }

        # ── Auth API (public) ──────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            add_header X-Request-Id $req_id always;
        }

        # ── Internal auth verification (used by auth_request) ─
        location = /_auth_verify {
            internal;
            proxy_pass http://auth_api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
        }

        # ── Protected: Hello-World service ─────────────────────
        location /api/hello/ {
            auth_request /_auth_verify;

            # Forward user info from auth response headers
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Role $auth_role;

            proxy_pass http://hello_world/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            add_header X-Request-Id $req_id always;
        }

        # ── Protected: Hello-World-Restricted service ──────────
        location /api/hello-restricted/ {
            auth_request /_auth_verify;

            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Role $auth_role;

            proxy_pass http://hello_world_restricted/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            add_header X-Request-Id $req_id always;
        }

        # ── MCP Server (public — auth handled by JWT in headers) ─
        location /api/mcp/ {
            proxy_pass http://mcp_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $req_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            add_header X-Request-Id $req_id always;
        }

        # ── Frontend (public) ─────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
