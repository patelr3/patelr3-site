name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: patelr3-site-rg
  ACR_NAME: patelr3acr
  IMAGE_TAG: ${{ github.sha }}
  AZURE_CLIENT_ID: e8de1562-63b2-4236-9c74-d8e3bf83e61d
  AZURE_TENANT_ID: 50d3fb80-db3c-406e-bc9d-a22a6b825219
  AZURE_SUBSCRIPTION_ID: 34154ec0-9335-4f09-a67a-bda54a403a14

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, hello-world, hello-world-restricted]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push images
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"

          # Frontend — nginx serves SPA + proxies API (no build args needed)
          docker build \
            -t "${ACR_SERVER}/frontend:${{ env.IMAGE_TAG }}" \
            -t "${ACR_SERVER}/frontend:latest" \
            ./frontend
          docker push "${ACR_SERVER}/frontend:${{ env.IMAGE_TAG }}"
          docker push "${ACR_SERVER}/frontend:latest"

          # Backend services
          for svc in auth-api hello-world hello-world-restricted; do
            docker build -t "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}" \
                         -t "${ACR_SERVER}/${svc}:latest" \
                         ./${svc}
            docker push "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}"
            docker push "${ACR_SERVER}/${svc}:latest"
          done

          # MCP server (from submodule)
          docker build -t "${ACR_SERVER}/mcp-server:${{ env.IMAGE_TAG }}" \
                       -t "${ACR_SERVER}/mcp-server:latest" \
                       ./actual-server-setup/mcp-server
          docker push "${ACR_SERVER}/mcp-server:${{ env.IMAGE_TAG }}"
          docker push "${ACR_SERVER}/mcp-server:latest"

  deploy:
    name: Deploy to Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Key Vault
        id: secrets
        run: |
          KV_NAME="patelr3kvl3ytczhajsp7i"
          PG_PASS=$(az keyvault secret show --vault-name "$KV_NAME" --name postgres-password --query value -o tsv)
          echo "::add-mask::$PG_PASS"
          echo "pg_password=$PG_PASS" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deployments/main.bicep \
            --parameters deployments/parameters.json \
            --parameters \
              imageTag="${{ env.IMAGE_TAG }}" \
              postgresPassword="${{ steps.secrets.outputs.pg_password }}"

      - name: Update container app revisions
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
          for svc in frontend auth-api hello-world hello-world-restricted mcp-server; do
            az containerapp update \
              --name "patelr3-${svc}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}"
          done

      - name: Verify deployments
        run: |
          for svc in frontend auth-api hello-world hello-world-restricted mcp-server postgres; do
            STATUS=$(az containerapp revision list \
              --name "patelr3-${svc}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query '[0].properties.healthState' -o tsv)
            echo "patelr3-${svc}: ${STATUS}"
          done

      - name: Smoke-test production endpoints
        run: |
          FRONTEND_URL="https://www.arayosun.com"
          RETRIES=5
          DELAY=15
          PASS=0
          FAIL=0

          check() {
            local desc="$1" url="$2" expected="$3"
            for i in $(seq 1 $RETRIES); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url") || CODE="000"
              if [ "$CODE" = "$expected" ]; then
                echo "  ✓ $desc (HTTP $CODE)"
                PASS=$((PASS + 1))
                return
              fi
              echo "  … $desc attempt $i: got $CODE, want $expected"
              sleep $DELAY
            done
            echo "  ✗ $desc: expected $expected, got $CODE after $RETRIES attempts"
            FAIL=$((FAIL + 1))
          }

          echo "=== Production Smoke Tests ==="
          check "Frontend serves SPA"           "$FRONTEND_URL/"              "200"
          check "Nginx proxies /api/auth/me"    "$FRONTEND_URL/api/auth/me"   "401"
          check "Nginx proxies /api/hello/"     "$FRONTEND_URL/api/hello/"    "401"

          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Post-deploy integration tests
        run: |
          FRONTEND_URL="https://www.arayosun.com"
          CI_EMAIL="citestuser@localhost.dev"
          CI_PASS="CiTestPass2026!"
          COOKIE_JAR="/tmp/ci-cookies-$$"
          PASS=0
          FAIL=0

          pass() { PASS=$((PASS + 1)); echo "  ✓ $1"; }
          fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1: $2"; }

          # ── Register or login CI test user ─────────────────────
          echo "=== CI Integration Tests ==="
          echo ""
          echo "Authentication:"
          REG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$FRONTEND_URL/api/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$CI_EMAIL\",\"password\":\"$CI_PASS\",\"displayName\":\"CI Test User\"}" \
            -c "$COOKIE_JAR")

          if [ "$REG_STATUS" = "201" ]; then
            pass "Register CI user (201)"
          elif [ "$REG_STATUS" = "409" ]; then
            LOGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$FRONTEND_URL/api/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$CI_EMAIL\",\"password\":\"$CI_PASS\"}" \
              -c "$COOKIE_JAR")
            if [ "$LOGIN_STATUS" = "200" ]; then
              pass "Login CI user (already registered)"
            else
              fail "Login CI user" "expected 200, got $LOGIN_STATUS"
            fi
          else
            fail "Register CI user" "expected 201 or 409, got $REG_STATUS"
          fi

          # ── Authenticated endpoint tests ───────────────────────
          echo ""
          echo "Authenticated Routes:"

          # /auth/me should return authenticated
          ME_BODY=$(curl -s -b "$COOKIE_JAR" "$FRONTEND_URL/api/auth/me")
          ME_AUTH=$(echo "$ME_BODY" | grep -o '"authenticated":true' || echo "")
          if [ -n "$ME_AUTH" ]; then
            pass "GET /auth/me returns authenticated"
          else
            fail "GET /auth/me" "not authenticated: $ME_BODY"
          fi

          # /auth/services should return 200
          SVC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -b "$COOKIE_JAR" "$FRONTEND_URL/api/auth/services")
          if [ "$SVC_STATUS" = "200" ]; then pass "GET /auth/services (200)"; else fail "GET /auth/services" "expected 200, got $SVC_STATUS"; fi

          # hello-world should return service name
          HW_BODY=$(curl -s -b "$COOKIE_JAR" "$FRONTEND_URL/api/hello/")
          HW_SVC=$(echo "$HW_BODY" | grep -o '"service":"hello-world"' || echo "")
          if [ -n "$HW_SVC" ]; then pass "GET /api/hello/ returns service name"; else fail "GET /api/hello/" "unexpected: $HW_BODY"; fi

          # ── MCP Server direct test (validates finance-api key) ───
          echo ""
          echo "MCP Server:"

          # Extract JWT from cookie jar for MCP Authorization header
          JWT=$(grep "access_token" "$COOKIE_JAR" | awk '{print $NF}')
          MCP_URL="https://patelr3-mcp-server.gentlebay-ad6f417d.westus2.azurecontainerapps.io"

          # tools/list should return tools
          MCP_LIST=$(curl -s -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $JWT" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          TOOL_COUNT=$(echo "$MCP_LIST" | grep -o '"name"' | wc -l)
          if [ "$TOOL_COUNT" -gt 10 ]; then
            pass "MCP tools/list returns $TOOL_COUNT tools"
          else
            fail "MCP tools/list" "expected >10 tools, got: $MCP_LIST"
          fi

          # tools/call list_budgets — tests finance-api key connectivity
          # citestuser has no AB instance, so we expect an error about deployment,
          # NOT a 401 from finance-api. A 401 means the key is wrong.
          MCP_CALL=$(curl -s -X POST "$MCP_URL/mcp" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $JWT" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_budgets","arguments":{}}}')
          if echo "$MCP_CALL" | grep -q "401"; then
            fail "MCP tools/call list_budgets" "finance-api key mismatch (401): $MCP_CALL"
          elif echo "$MCP_CALL" | grep -q '"content"'; then
            pass "MCP tools/call list_budgets (finance-api key works)"
          else
            fail "MCP tools/call list_budgets" "unexpected response: $MCP_CALL"
          fi

          # ── SunnieAI chat health ───────────────────────────────
          echo ""
          echo "SunnieAI:"
          CHAT_BODY=$(curl -s -b "$COOKIE_JAR" "$FRONTEND_URL/api/auth/chat/health")
          CHAT_CONFIGURED=$(echo "$CHAT_BODY" | grep -o '"configured":true' || echo "")
          if [ -n "$CHAT_CONFIGURED" ]; then
            pass "GET /auth/chat/health returns configured:true"
          else
            fail "GET /auth/chat/health" "expected configured:true, got: $CHAT_BODY"
          fi

          CHAT_EP=$(echo "$CHAT_BODY" | grep -o '"endpoint":"set"' || echo "")
          if [ -n "$CHAT_EP" ]; then pass "Foundry endpoint is set"; else fail "Foundry endpoint" "missing"; fi

          CHAT_AGENT=$(echo "$CHAT_BODY" | grep -o '"agentId":"set"' || echo "")
          if [ -n "$CHAT_AGENT" ]; then pass "Foundry agent ID is set"; else fail "Foundry agent ID" "missing"; fi

          # Create a thread and send a message
          THREAD_BODY=$(curl -s -X POST "$FRONTEND_URL/api/auth/chat/threads" \
            -H "Content-Type: application/json" \
            -d '{"title":"CI test thread"}' \
            -b "$COOKIE_JAR")
          THREAD_ID=$(echo "$THREAD_BODY" | grep -o '"foundry_thread_id":"[^"]*"' | cut -d'"' -f4)
          if [ -n "$THREAD_ID" ]; then
            pass "POST /auth/chat/threads creates thread ($THREAD_ID)"
          else
            fail "POST /auth/chat/threads" "no thread ID: $THREAD_BODY"
          fi

          if [ -n "$THREAD_ID" ]; then
            MSG_BODY=$(curl -s --max-time 60 \
              -X POST "$FRONTEND_URL/api/auth/chat/threads/$THREAD_ID/messages" \
              -H "Content-Type: application/json" \
              -d '{"content":"List my budgets"}' \
              -b "$COOKIE_JAR" -w "\n__HTTP_STATUS__%{http_code}")
            MSG_STATUS=$(echo "$MSG_BODY" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
            MSG_STREAM=$(echo "$MSG_BODY" | grep -v '__HTTP_STATUS__')
            if [ "$MSG_STATUS" != "200" ]; then
              fail "POST message" "expected 200, got $MSG_STATUS"
            elif echo "$MSG_STREAM" | grep -q '"thread.run.failed"'; then
              FAIL_MSG=$(echo "$MSG_STREAM" | grep 'thread.run.failed' | head -1)
              fail "POST message stream" "run failed: $FAIL_MSG"
            else
              pass "POST message returns 200 (streaming, no failures)"
            fi

            # Clean up test thread
            curl -s -o /dev/null -X DELETE "$FRONTEND_URL/api/auth/chat/threads/$THREAD_ID" -b "$COOKIE_JAR" || true
          fi

          # ── Cleanup ────────────────────────────────────────────
          curl -s -o /dev/null -b "$COOKIE_JAR" "$FRONTEND_URL/api/auth/logout" || true
          rm -f "$COOKIE_JAR"

          echo ""
          echo "=== CI Integration Results: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
