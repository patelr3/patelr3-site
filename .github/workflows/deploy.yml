name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: patelr3-site-rg
  ACR_NAME: patelr3acr
  IMAGE_TAG: ${{ github.sha }}
  AZURE_CLIENT_ID: e8de1562-63b2-4236-9c74-d8e3bf83e61d
  AZURE_TENANT_ID: 50d3fb80-db3c-406e-bc9d-a22a6b825219
  AZURE_SUBSCRIPTION_ID: 34154ec0-9335-4f09-a67a-bda54a403a14

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, hello-world, hello-world-restricted]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  build-and-push:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Read Firebase config from Key Vault
        run: |
          KV_NAME=$(az keyvault list -g ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "VITE_FIREBASE_API_KEY=$(az keyvault secret show --vault-name "$KV_NAME" --name firebase-api-key --query value -o tsv)" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_AUTH_DOMAIN=$(az keyvault secret show --vault-name "$KV_NAME" --name firebase-auth-domain --query value -o tsv)" >> "$GITHUB_ENV"
          echo "VITE_FIREBASE_PROJECT_ID=$(az keyvault secret show --vault-name "$KV_NAME" --name firebase-project-id --query value -o tsv)" >> "$GITHUB_ENV"

      - name: Build & push images
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"

          # Frontend — Firebase config baked in via build args from AKV
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ env.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ env.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ env.VITE_FIREBASE_PROJECT_ID }}" \
            -t "${ACR_SERVER}/frontend:${{ env.IMAGE_TAG }}" \
            -t "${ACR_SERVER}/frontend:latest" \
            ./frontend
          docker push "${ACR_SERVER}/frontend:${{ env.IMAGE_TAG }}"
          docker push "${ACR_SERVER}/frontend:latest"

          # Backend services
          for svc in auth-api hello-world hello-world-restricted; do
            docker build -t "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}" \
                         -t "${ACR_SERVER}/${svc}:latest" \
                         ./${svc}
            docker push "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}"
            docker push "${ACR_SERVER}/${svc}:latest"
          done

          # MCP server (from submodule)
          docker build -t "${ACR_SERVER}/mcp-server:${{ env.IMAGE_TAG }}" \
                       -t "${ACR_SERVER}/mcp-server:latest" \
                       ./sunniebudget/mcp-server
          docker push "${ACR_SERVER}/mcp-server:${{ env.IMAGE_TAG }}"
          docker push "${ACR_SERVER}/mcp-server:latest"

  deploy:
    name: Deploy to Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Fetch secrets from Key Vault
        id: secrets
        run: |
          KV_NAME="patelr3kvl3ytczhajsp7i"
          PG_PASS=$(az keyvault secret show --vault-name "$KV_NAME" --name postgres-password --query value -o tsv)
          echo "::add-mask::$PG_PASS"
          echo "pg_password=$PG_PASS" >> "$GITHUB_OUTPUT"
          FINANCE_KEY=$(az keyvault secret show --vault-name "$KV_NAME" --name finance-api-key --query value -o tsv)
          echo "::add-mask::$FINANCE_KEY"
          echo "finance_api_key=$FINANCE_KEY" >> "$GITHUB_OUTPUT"
          FOUNDRY_ENDPOINT=$(az keyvault secret show --vault-name "$KV_NAME" --name foundry-project-endpoint --query value -o tsv)
          echo "::add-mask::$FOUNDRY_ENDPOINT"
          echo "foundry_endpoint=$FOUNDRY_ENDPOINT" >> "$GITHUB_OUTPUT"
          MCP_CONN_ID=$(az keyvault secret show --vault-name "$KV_NAME" --name foundry-mcp-connection-id --query value -o tsv)
          echo "::add-mask::$MCP_CONN_ID"
          echo "mcp_connection_id=$MCP_CONN_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file deployments/main.bicep \
            --parameters deployments/parameters.json \
            --parameters \
              imageTag="${{ env.IMAGE_TAG }}" \
              postgresPassword="${{ steps.secrets.outputs.pg_password }}"

      - name: Update container app revisions
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
          for svc in frontend auth-api hello-world hello-world-restricted mcp-server; do
            az containerapp update \
              --name "patelr3-${svc}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "${ACR_SERVER}/${svc}:${{ env.IMAGE_TAG }}"
          done

      - name: Update Foundry agent version
        working-directory: auth-api
        run: |
          npm install --omit=dev --ignore-scripts 2>/dev/null
          FOUNDRY_PROJECT_ENDPOINT="${{ steps.secrets.outputs.foundry_endpoint }}" \
          FOUNDRY_MCP_CONNECTION_ID="${{ steps.secrets.outputs.mcp_connection_id }}" \
          node ../scripts/update-foundry-agent.mjs

      - name: Verify deployments
        run: |
          for svc in frontend auth-api hello-world hello-world-restricted mcp-server postgres; do
            STATUS=$(az containerapp revision list \
              --name "patelr3-${svc}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query '[0].properties.healthState' -o tsv)
            echo "patelr3-${svc}: ${STATUS}"
          done

      - name: Smoke-test production endpoints
        run: |
          FRONTEND_URL="https://www.arayosun.com"
          RETRIES=5
          DELAY=15
          PASS=0
          FAIL=0

          check() {
            local desc="$1" url="$2" expected="$3"
            for i in $(seq 1 $RETRIES); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url") || CODE="000"
              if [ "$CODE" = "$expected" ]; then
                echo "  ✓ $desc (HTTP $CODE)"
                PASS=$((PASS + 1))
                return
              fi
              echo "  … $desc attempt $i: got $CODE, want $expected"
              sleep $DELAY
            done
            echo "  ✗ $desc: expected $expected, got $CODE after $RETRIES attempts"
            FAIL=$((FAIL + 1))
          }

          echo "=== Production Smoke Tests ==="
          check "Frontend serves SPA"           "$FRONTEND_URL/"              "200"
          check "Nginx proxies /api/auth/me"    "$FRONTEND_URL/api/auth/me"   "401"
          check "Nginx proxies /api/hello/"     "$FRONTEND_URL/api/hello/"    "401"

          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Post-deploy integration tests
        run: |
          FRONTEND_URL="https://www.arayosun.com"
          PASS=0
          FAIL=0

          pass() { PASS=$((PASS + 1)); echo "  ✓ $1"; }
          fail() { FAIL=$((FAIL + 1)); echo "  ✗ $1: $2"; }

          echo "=== CI Integration Tests ==="
          echo ""
          echo "Unauthenticated Endpoints:"

          # Frontend serves HTML
          FE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          if [ "$FE_STATUS" = "200" ]; then pass "Frontend serves HTML (200)"; else fail "Frontend" "expected 200, got $FE_STATUS"; fi

          # /auth/me returns 401 unauthenticated
          ME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/api/auth/me")
          if [ "$ME_STATUS" = "401" ]; then pass "GET /auth/me returns 401"; else fail "GET /auth/me" "expected 401, got $ME_STATUS"; fi

          # /auth/services returns 401 unauthenticated
          SVC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/api/auth/services")
          if [ "$SVC_STATUS" = "401" ]; then pass "GET /auth/services returns 401"; else fail "GET /auth/services" "expected 401, got $SVC_STATUS"; fi

          # hello-world returns 401 unauthenticated
          HW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/api/hello/")
          if [ "$HW_STATUS" = "401" ]; then pass "GET /api/hello/ returns 401"; else fail "GET /api/hello/" "expected 401, got $HW_STATUS"; fi

          echo ""
          echo "OIDC Provider:"
          OIDC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/api/auth/oidc/.well-known/openid-configuration")
          if [ "$OIDC_STATUS" = "200" ]; then pass "OIDC discovery returns 200"; else fail "OIDC discovery" "expected 200, got $OIDC_STATUS"; fi

          JWKS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/api/auth/oidc/jwks")
          if [ "$JWKS_STATUS" = "200" ]; then pass "OIDC JWKS returns 200"; else fail "OIDC JWKS" "expected 200, got $JWKS_STATUS"; fi

          echo ""
          echo "MCP Server:"
          MCP_URL="https://patelr3-mcp-server.gentlebay-ad6f417d.westus2.azurecontainerapps.io"
          MCP_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$MCP_URL/health" 2>/dev/null || echo "skip")
          if [ "$MCP_HEALTH" = "200" ]; then pass "MCP health returns 200"; else fail "MCP health" "expected 200, got $MCP_HEALTH"; fi

          echo ""
          echo "=== CI Integration Results: $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
