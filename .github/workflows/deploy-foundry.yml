name: Deploy AI Foundry

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model deployment name'
        default: 'gpt-4o'
        required: false

permissions:
  id-token: write
  contents: read

env:
  FOUNDRY_RESOURCE_GROUP: patelr3-ai-rg
  FOUNDRY_LOCATION: westus
  AZURE_CLIENT_ID: e8de1562-63b2-4236-9c74-d8e3bf83e61d
  AZURE_TENANT_ID: 50d3fb80-db3c-406e-bc9d-a22a6b825219
  AZURE_SUBSCRIPTION_ID: 34154ec0-9335-4f09-a67a-bda54a403a14

jobs:
  deploy-foundry:
    name: Deploy AI Foundry Infrastructure
    runs-on: ubuntu-latest
    outputs:
      project-endpoint: ${{ steps.bicep.outputs.project-endpoint }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: az group create --name ${{ env.FOUNDRY_RESOURCE_GROUP }} --location ${{ env.FOUNDRY_LOCATION }} --output none 2>/dev/null || true

      - name: Deploy Bicep
        id: bicep
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group ${{ env.FOUNDRY_RESOURCE_GROUP }} \
            --template-file deployments/foundry.bicep \
            --parameters deployments/foundry-parameters.json \
            --parameters location="${{ env.FOUNDRY_LOCATION }}" \
            --query 'properties.outputs' -o json)

          PROJECT_ENDPOINT=$(echo "$OUTPUTS" | python3 -c "import sys,json; print(json.load(sys.stdin)['projectEndpoint']['value'])")
          echo "project-endpoint=$PROJECT_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "✓ Foundry infrastructure deployed"
          echo "  Project endpoint: $PROJECT_ENDPOINT"

      - name: Store endpoint in Key Vault
        run: |
          az keyvault secret set \
            --vault-name patelr3kvl3ytczhajsp7i \
            --name foundry-project-endpoint \
            --value "${{ steps.bicep.outputs.project-endpoint }}" \
            --output none

  register-agent:
    name: Register SunnieAI Agent
    needs: deploy-foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install azure-ai-projects azure-ai-agents azure-identity

      - name: Get MCP server URL
        id: mcp
        run: |
          MCP_FQDN=$(az containerapp show \
            --name patelr3-mcp-server \
            --resource-group patelr3-site-rg \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "url=https://${MCP_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Register/update agent
        id: agent
        env:
          PROJECT_ENDPOINT: ${{ needs.deploy-foundry.outputs.project-endpoint }}
          MCP_SERVER_URL: ${{ steps.mcp.outputs.url }}
        run: |
          python scripts/setup-foundry-agent.py \
            --model "${{ github.event.inputs.model || 'gpt-4o' }}" \
            --mcp-url "${{ steps.mcp.outputs.url }}"

      - name: Store agent ID in Key Vault
        run: |
          AGENT_ID=$(python3 -c "import json; print(json.load(open('scripts/.foundry-agent-state.json'))['agent_id'])")
          az keyvault secret set \
            --vault-name patelr3kvl3ytczhajsp7i \
            --name foundry-agent-id \
            --value "$AGENT_ID" \
            --output none
          echo "✓ Agent ID stored in Key Vault: $AGENT_ID"
