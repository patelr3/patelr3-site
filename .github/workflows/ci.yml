name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, hello-world, hello-world-restricted]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-build]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=patelr3
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=patelr3_site
          JWT_SECRET=ci-test-secret
          GOOGLE_CLIENT_ID=fake-client-id
          GOOGLE_CLIENT_SECRET=fake-client-secret
          DATABASE_URL=postgresql://patelr3:ci-test-password@postgres:5432/patelr3_site
          FRONTEND_URL=http://localhost
          EOF

      - name: Start services
        run: |
          docker compose up -d --build --wait
          sleep 5

      - name: Run integration tests
        run: bash tests/integration.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50
